# Optional hosting blueprint. Render requires account authorization and may charge for the disk.
services:
  - type: web
    name: atlas-customerai
    runtime: docker
    plan: starter
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: atlas-runtime
      mountPath: /app/runtime
      sizeGB: 1
    envVars:
      - key: ATLAS_MODE
        value: demo
      - key: DEMO_ACCESS
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////app/runtime/atlas.db
      - key: CHROMA_PATH
        value: /app/runtime/chroma
      - key: ADMIN_API_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
